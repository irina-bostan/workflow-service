spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5

duffel:
  enabled: true
  api-token: ${DUFFEL_API_TOKEN}
  default-origin: ${DUFFEL_DEFAULT_ORIGIN:LHR}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://staging.techquarter.com}

aws:
  region: ${AWS_REGION:eu-west-1}
  sqs:
    enabled: true
    booking-events-queue-url: ${SQS_BOOKING_EVENTS_URL}
    dlq-url: ${SQS_BOOKING_EVENTS_DLQ_URL:}

logging:
  level:
    com.aniri: DEBUG

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}

security:
  jwt:
    enabled: true

spring.security.oauth2.resourceserver.jwt:
  issuer-uri: ${COGNITO_ISSUER_URI}
  jwk-set-uri: ${COGNITO_ISSUER_URI}/.well-known/jwks.json
