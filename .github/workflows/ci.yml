name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  IMAGE_NAME: workflow-service

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run all tests (unit, integration, Cucumber BDD)
        run: mvn verify -B

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/

  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    outputs:
      image-tag: ${{ steps.meta.outputs.sha-tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Package application
        run: mvn package -DskipTests -B

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        id: meta
        run: |
          SHA_TAG=${{ github.sha }}
          docker build -t $ECR_REGISTRY/$IMAGE_NAME:$SHA_TAG .
          docker tag  $ECR_REGISTRY/$IMAGE_NAME:$SHA_TAG \
                      $ECR_REGISTRY/$IMAGE_NAME:latest
          docker push $ECR_REGISTRY/$IMAGE_NAME:$SHA_TAG
          docker push $ECR_REGISTRY/$IMAGE_NAME:latest
          echo "sha-tag=$SHA_TAG" >> $GITHUB_OUTPUT

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to staging ECS
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.STAGING_CLUSTER }} \
            --service $IMAGE_NAME \
            --force-new-deployment

      - name: Wait for staging deployment to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster ${{ secrets.STAGING_CLUSTER }} \
            --services $IMAGE_NAME

      - name: Smoke test
        run: |
          STATUS=$(curl -sf https://staging.techquarter.com/actuator/health | jq -r '.status')
          if [ "$STATUS" != "UP" ]; then
            echo "Health check failed: $STATUS"
            exit 1
          fi
          echo "Staging health check passed: $STATUS"

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production   # Requires manual approval in GitHub Environments
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to production ECS (rolling update)
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.PROD_CLUSTER }} \
            --service $IMAGE_NAME \
            --force-new-deployment

      - name: Wait for production deployment to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster ${{ secrets.PROD_CLUSTER }} \
            --services $IMAGE_NAME

      - name: Assert CloudWatch alarms are green
        run: |
          ALARM_STATE=$(aws cloudwatch describe-alarms \
            --alarm-name-prefix "workflow-service-" \
            --state-value ALARM \
            --query 'MetricAlarms[].AlarmName' \
            --output text)
          if [ -n "$ALARM_STATE" ]; then
            echo "Post-deploy alarms in ALARM state: $ALARM_STATE"
            exit 1
          fi
          echo "All alarms GREEN. Deployment successful."
