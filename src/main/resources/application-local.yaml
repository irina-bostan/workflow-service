spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9229/local_70VnjvDS
          jwk-set-uri: http://localhost:9229/local_70VnjvDS/.well-known/jwks.json
  datasource:
    url: jdbc:postgresql://localhost:5432/workflowdb
    username: workflow
    password: workflow
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5

cors:
  allowed-origins: "*"

aws:
  region: eu-west-1
  endpoint-override: http://localhost:4566
  credentials:
    access-key: test
    secret-key: test
  sqs:
    enabled: true
    booking-events-queue-url: http://sqs.eu-west-1.localhost.localstack.cloud:4566/000000000000/booking-events.fifo

logging:
  json-structure:
    enabled: true
  level:
    com.aniri: DEBUG

# Local uses the Duffel sandbox. Without this block, DuffelSearchProvider is
# not registered as a bean (its @ConditionalOnProperty gate stays false) and
# SearchService falls back to buildMockResults.
duffel:
  enabled: true
  api-token: ${DUFFEL_API_TOKEN:duffel_test_8N1wXfJpediZYaLZdoN3W3QZzXsdkENl_H6L55HqGnL}
  default-origin: LHR
