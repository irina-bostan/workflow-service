            descending.
          sortKey: -1777207756839
        method: GET
        parameters:
          - name: employeeId
            value: "{{ _.employeeId }}"
            description: ""
            disabled: false
          - name: page
            value: "0"
            description: ""
            disabled: false
          - name: size
            value: "10"
            description: ""
            disabled: false
        authentication:
          type: bearer
          token: "{{ _.token }}"
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.baseUrl }}/bookings"
        name: Duplicate Booking (same Idempotency-Key) — shows idempotency
        meta:
          id: req_8286f8f1f63448548e86f8b5d4e7b9a9
          created: 1777207756938
          modified: 1777208586419
          isPrivate: false
          description: Run this request twice with the same Idempotency-Key. The second
            response is identical to the first, and only one booking is
            persisted.
          sortKey: -1777207756976.5
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "employeeId": "EMP9876",
              "resourceType": "FLIGHT",
              "destination": "NYC",
              "departureDate": "2027-11-05T08:00:00Z",
              "travelerCount": 1,
              "costCenterRef": "CC-456"
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: Idempotency-Key
            value: 00000000-0000-0000-0000-000000000001
        authentication:
          type: bearer
          token: "{{ _.token }}"
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
