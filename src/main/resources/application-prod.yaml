spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: workflow-pool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 2000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10

duffel:
  enabled: true
  api-token: ${DUFFEL_API_TOKEN}
  default-origin: ${DUFFEL_DEFAULT_ORIGIN:LHR}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app.techquarter.com}

aws:
  region: ${AWS_REGION:eu-west-1}
  sqs:
    enabled: true
    booking-events-queue-url: ${SQS_BOOKING_EVENTS_URL}

# Faster outbox drain at peak: 100-row batch every 500 ms = up to 200 events/sec/task.
# 2 tasks → 400/sec drain capacity vs 100 rps inflow → 4× headroom.
outbox:
  relay:
    fixed-delay-ms: 500

logging:
  level:
    com.aniri: INFO

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}

security:
  jwt:
    enabled: true

spring.security.oauth2.resourceserver.jwt:
  issuer-uri: ${COGNITO_ISSUER_URI}
  jwk-set-uri: ${COGNITO_ISSUER_URI}/.well-known/jwks.json
