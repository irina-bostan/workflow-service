      - url: "{{ _.baseUrl }}/employees"
        name: Register Employee
        meta:
          id: req_b283452db7c94372afbc37008356ce24
          created: 1777207756937
          modified: 1777208743520
          isPrivate: false
          description: Registers a new employee. Returns 201 with the Employee body on
            success, 409 if employeeId or email already exists.
          sortKey: -1777207756937
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "employeeId": "EMP9870",
              "firstName": "Alice",
              "lastName": "Smith",
              "email": "alice.smith@techquarter.com",
              "department": "Engineering",
              "costCentreDefault": "CC-456"
            }
        headers:
          - name: Content-Type
            value: application/json
        authentication:
          type: bearer
          token: "{{ _.token }}"
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
  - name: Auth (cognito-local)
    meta:
      id: fld_8e9285765da14d0eb96728cd4a3c743d
      created: 1777207756936
      modified: 1777208725761
      sortKey: -1777207756938
      description: ""
    children:
      - url: "{{ _.cognitoUrl }}/"
        name: Get ID Token (USER_PASSWORD_AUTH)
        meta:
          id: req_f904ff68762741d2b7adde550e0a67cc
          created: 1777207756936
          modified: 1777207756936
          isPrivate: false
          description: Calls cognito-local to mint an ID token. The response script
            auto-stores AuthenticationResult.IdToken into the `token` env var.
            The cognitoClientId env var is printed by local/setup-cognito.sh.
          sortKey: -1777207756936
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "AuthFlow": "USER_PASSWORD_AUTH",
              "ClientId": "{{ _.cognitoClientId }}",
              "AuthParameters": {
                "USERNAME": "{{ _.cognitoUsername }}",
                "PASSWORD": "{{ _.cognitoPassword }}"
              }
            }
        headers:
          - name: Content-Type
            value: application/x-amz-json-1.1
          - name: X-Amz-Target
            value: AWSCognitoIdentityProviderService.InitiateAuth
        scripts:
          afterResponse: >-
            if (insomnia.response.status === 200) {
                const body = insomnia.response.json();
                if (body && body.AuthenticationResult && body.AuthenticationResult.IdToken) {
                    insomnia.environment.set('token', body.AuthenticationResult.IdToken);
                }
            }
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
  - name: Bookings
    meta:
      id: fld_82bb474df1f84aadb18ff9503a84dc00
      created: 1777207756937
      modified: 1777207756937
      sortKey: -1777207756937
      description: ""
    children:
      - url: "{{ _.baseUrl }}/bookings"
        name: Create Hotel Booking
        meta:
          id: req_19774eb635bf4f23ad11ff8fe1010072
          created: 1777207756937
          modified: 1777208569268
          isPrivate: false
          description: Creates a hotel booking. Hotel bookings require returnDate. Returns
            201 with the Booking body — the response script auto-stores `id`
            into the `bookingId` env var so the appointments endpoint can use it
            immediately.
          sortKey: -1777207756989
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "employeeId": "EMP9876",
              "resourceType": "HOTEL",
              "destination": "NYC",
              "departureDate": "2027-11-05T14:00:00Z",
              "returnDate": "2027-11-08T11:00:00Z",
              "travelerCount": 1,
              "costCenterRef": "CC-456",
              "tripPurpose": "Client meeting - Acme Corp"
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: Idempotency-Key
            value: "{% uuid 'v4' %}"
        authentication:
          type: bearer
          token: "{{ _.token }}"
        scripts:
          afterResponse: |-
            if (insomnia.response.status === 201) {
                const body = insomnia.response.json();
                if (body && body.id) {
                    insomnia.environment.set('bookingId', body.id);
                }
            }
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.baseUrl }}/bookings"
        name: Create Flight Booking
        meta:
          id: req_7a5dbb4f4e2e4316955d185aa7b41551
          created: 1777207756937
          modified: 1777208544918
          isPrivate: false
          description: Creates a flight booking. Requires Idempotency-Key header. Returns
            201 with the Booking body.
          sortKey: -1777207757039
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "employeeId": "EMP9876",
              "resourceType": "FLIGHT",
              "destination": "NYC",
              "departureDate": "2027-11-05T08:00:00Z",
              "returnDate": "2027-11-08T18:00:00Z",
              "travelerCount": 1,
              "costCenterRef": "CC-456",
              "tripPurpose": "Client meeting - Acme Corp"
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: Idempotency-Key
            value: "{% uuid 'v4' %}"
        authentication:
          type: bearer
          token: "{{ _.token }}"
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.baseUrl }}/bookings"
